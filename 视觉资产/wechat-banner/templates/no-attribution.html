<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IF.Link 公众号结尾 Banner（无人员署名版）</title>
  <style>
    @font-face {
      font-family: "Google Sans Flex";
      src: url("../assets/fonts/GoogleSansFlex.ttf") format("truetype");
      font-weight: 100 1000;
    }
    @font-face {
      font-family: "Noto Sans CJK SC";
      src: url("../assets/fonts/NotoSansCJK-Regular.ttc") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: "Noto Sans CJK SC";
      src: url("../assets/fonts/NotoSansCJK-Bold.ttc") format("truetype");
      font-weight: 700;
    }

    * { box-sizing: border-box; }
    html, body { width: 900px; height: 373px; margin: 0; overflow: hidden; }
    body {
      color: #f5f5f5;
      font-family: "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
      background: #000;
    }
    .banner { position: relative; width: 900px; height: 373px; background: #000; }

    /* Keep the QR group right-anchored so its visual edge matches the text below. */
    .qr-group {
      position: absolute;
      top: 58px;
      right: 50px;
      display: flex;
      gap: 53px;
    }
    .qr-item { width: 99px; text-align: center; }
    .qr {
      display: block;
      width: 99px;
      height: 99px;
      object-fit: contain;
    }
    .qr-label {
      margin-top: 12px;
      color: #f5f5f5;
      font-size: 14px;
      line-height: 1;
      white-space: nowrap;
    }

    .brand { position: absolute; top: 242px; left: 50px; }
    .brand-logo { display: block; width: 193px; height: auto; }
    .tagline {
      position: absolute;
      bottom: 45px;
      left: 52px;
      margin: 0;
      color: #f5f5f5;
      font-family: "Google Sans Flex", sans-serif;
      font-size: 20px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
      text-box: trim-both cap alphabetic;
    }
    .community-tag {
      position: absolute;
      right: 50px;
      bottom: 45px;
      color: #f5f5f5;
      font-size: 24px;
      line-height: 32px;
      font-weight: 700;
      text-align: right;
      white-space: nowrap;
      text-box: trim-both cap alphabetic;
    }
  </style>
</head>
<body>
  <footer class="banner" aria-label="IF.Link 公众号无人员署名版结尾 Banner">
    <div class="qr-group" aria-label="社交二维码">
      <div class="qr-item">
        <img class="qr" src="../assets/banner/qr_wechat.png" alt="微信公众号二维码">
        <div class="qr-label">微信公众号</div>
      </div>
      <div class="qr-item">
        <img class="qr" src="../assets/banner/qr_xhs.png" alt="小红书二维码">
        <div class="qr-label">小红书</div>
      </div>
    </div>

    <section class="brand" aria-label="IF.Link 品牌">
      <img class="brand-logo" src="../assets/banner/logo.png" alt="IF.Link">
    </section>
    <div class="tagline">Link the IFs, connect the Dots.</div>
    <div class="community-tag">源自东南大学的<br>AI 创客与科技交流社区</div>
  </footer>
</body>
</html>
