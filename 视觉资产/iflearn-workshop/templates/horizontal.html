<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IF.Learn {{TITLE_ZH}}</title>
  <style>
    @font-face { font-family: "Inter Variable"; src: url("assets/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    @font-face { font-family: "Source Han Sans SC"; src: url("assets/fonts/SourceHanSansSC-Regular.otf") format("opentype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Source Han Sans SC"; src: url("assets/fonts/SourceHanSansSC-Medium.otf") format("opentype"); font-weight: 500; font-display: block; }
    @font-face { font-family: "Source Han Sans SC"; src: url("assets/fonts/SourceHanSansSC-Bold.otf") format("opentype"); font-weight: 700; font-display: block; }
    @font-face { font-family: "Source Han Sans SC"; src: url("assets/fonts/SourceHanSansSC-Heavy.otf") format("opentype"); font-weight: 900; font-display: block; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { display: grid; place-items: center; overflow: hidden; background: #d9d9d6; font-family: "Inter Variable", "Source Han Sans SC", sans-serif; font-size-adjust: from-font; }
    @supports not (font-size-adjust: from-font) { body { font-size-adjust: .727; } }
    figure { margin: 0; }
    .artboard { position: relative; flex: none; width: 1280px; height: 720px; overflow: hidden; background: #eeeeec; color: #111110; }
    .header { position: absolute; top: 34px; left: 54px; right: 54px; display: flex; align-items: center; height: 42px; }
    .brand { display: flex; align-items: center; gap: 16px; }
    .iflink { width: 128px; height: 32px; object-fit: contain; }
    .brand-divider { width: 1px; height: 27px; background: #b8b8b4; }
    .brand-note { color: #666662; font-size: 13px; font-weight: 500; letter-spacing: 1px; }
    .organizer-logo { width: 36px; height: 36px; object-fit: contain; }
    .organizer { font-size: 16px; font-weight: 700; }
    .header-note { margin-left: auto; font-size: 19px; font-weight: 800; letter-spacing: 1px; }
    .kicker { position: absolute; top: 151px; left: 54px; display: flex; align-items: center; gap: 14px; margin: 0; font-size: 30px; line-height: 1.2; font-weight: 750; }
    .kicker img { width: 138px; height: 35px; object-fit: contain; }
    .title-orange { position: absolute; top: 216px; left: 54px; display: flex; align-items: center; width: 635px; height: 138px; padding: 0 22px; background: #ff4f0b; font-size: {{TITLE_EN_SIZE}}px; line-height: 1; font-weight: 900; letter-spacing: -3px; white-space: nowrap; }
    .title-black { position: absolute; top: 354px; left: 54px; display: flex; align-items: center; width: 540px; height: 90px; padding: 0 22px; background: #111110; color: #fff; font-size: {{TITLE_ZH_SIZE}}px; line-height: 1; font-weight: 800; letter-spacing: 1px; white-space: nowrap; }
    .art { position: absolute; top: 30px; left: 825px; width: 420px; height: 465px; }
    .art svg, .art img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .intro { position: absolute; top: 486px; left: 54px; margin: 0; font-size: 26px; line-height: 1.3; font-weight: 750; }
    .topics { position: absolute; top: 529px; left: 54px; margin: 0; color: #555550; font-size: 18px; line-height: 1.4; }
    .session { position: absolute; top: 570px; left: 54px; display: flex; align-items: center; height: 48px; }
    .date { color: #d74b18; font-size: 34px; font-weight: 850; }
    .session-divider { width: 1px; height: 28px; margin: 0 20px; background: #c4c4bf; }
    .time { font-size: 28px; font-weight: 750; }
    .location { position: absolute; top: 632px; left: 54px; margin: 0; font-size: 21px; font-weight: 650; }
    .features { position: absolute; top: 674px; left: 54px; margin: 0; color: #555550; font-size: 16px; }
    .takeaway { position: absolute; top: 500px; left: 835px; width: 390px; padding-left: 28px; border-left: 1px solid #c7c7c2; }
    .eyebrow { margin: 0 0 13px; color: #d74b18; font-size: 11px; font-weight: 700; letter-spacing: 1.8px; }
    .takeaway h2 { margin: 0; font-size: 26px; line-height: 1.25; font-weight: 800; }
    .takeaway-copy { max-width: 210px; margin: 12px 0 0; color: #555550; font-size: 16px; line-height: 1.5; }
    .opportunity { max-width: 210px; margin: 16px 0 0; color: #d74b18; font-size: 14px; line-height: 1.45; font-weight: 700; }
    .qr-code { position: absolute; top: 38px; right: 0; width: 116px; text-align: center; }
    .qr-code img { display: block; width: 116px; height: 116px; padding: 4px; border: 1px solid #d4d4cf; background: #fff; object-fit: contain; }
    .qr-placeholder { display: grid; place-items: center; width: 116px; height: 116px; border: 1px dashed #aaa9a3; color: #777772; font-size: 14px; }
    .qr-code figcaption { margin-top: 8px; font-size: 13px; font-weight: 650; }
    @page { size: 1280px 720px; margin: 0; }
    @media print { body { display: block; background: none; } .artboard { transform: none !important; } }
  </style>
</head>
<body>
  <main class="artboard" data-width="1280" data-height="720">
    <header class="header">
      <div class="brand">
        <img class="iflink" src="assets/logos/iflink-light-trimmed.svg" alt="IF.Link">
        <span class="brand-divider"></span>
        <span class="brand-note">{{ORGANIZER_LABEL}}</span>
        {{ORGANIZER_LOGO_HTML}}
        <span class="organizer">{{ORGANIZER}}</span>
      </div>
      <div class="header-note">{{HEADER_NOTE}}</div>
    </header>
    <h2 class="kicker"><img src="assets/logos/iflearn-light-trimmed.svg" alt="IF.Learn"><span>Workshop · {{EDITION}}</span></h2>
    <div class="title-orange">{{TITLE_EN}}</div>
    <div class="title-black">{{TITLE_ZH}}</div>
    <div class="art">{{ILLUSTRATION_HTML}}</div>
    <p class="intro">{{INTRO}}</p>
    <p class="topics">{{TOPICS}}</p>
    <div class="session"><span class="date">{{DATE}}</span><span class="session-divider"></span><span class="time">{{TIME}}</span></div>
    <p class="location">{{LOCATION}}</p>
    <p class="features">{{FEATURES}}</p>
    <section class="takeaway">
      <p class="eyebrow">IF.LEARN WORKSHOP</p>
      <h2>{{TAKEAWAY_TITLE}}</h2>
      <p class="takeaway-copy">{{TAKEAWAY_COPY}}</p>
      <p class="opportunity">{{OPPORTUNITY}}</p>
      <figure class="qr-code">{{QR_HTML}}<figcaption>{{QR_CAPTION}}</figcaption></figure>
    </section>
  </main>
  <script>
    const artboard = document.querySelector('.artboard');
    function fitArtboard() {
      const width = Number(artboard.dataset.width);
      const height = Number(artboard.dataset.height);
      const scale = Math.min(innerWidth / width, innerHeight / height);
      artboard.style.position = 'fixed';
      artboard.style.transformOrigin = 'top left';
      artboard.style.left = `${(innerWidth - width * scale) / 2}px`;
      artboard.style.top = `${(innerHeight - height * scale) / 2}px`;
      artboard.style.transform = `scale(${scale})`;
    }
    addEventListener('resize', fitArtboard);
    fitArtboard();
    window.posterReady = () => document.fonts.status === 'loaded' && Array.from(document.images).every(image => image.complete);
  </script>
</body>
</html>
