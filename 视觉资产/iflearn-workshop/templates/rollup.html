<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IF.Learn Workshop 易拉宝</title>
  <style>
    @font-face { font-family: "Inter Variable"; src: url("assets/fonts/InterVariable.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
    @font-face { font-family: "Source Han Sans SC"; src: url("assets/fonts/SourceHanSansSC-Regular.otf") format("opentype"); font-weight: 400; font-display: block; }
    @font-face { font-family: "Source Han Sans SC"; src: url("assets/fonts/SourceHanSansSC-Medium.otf") format("opentype"); font-weight: 500; font-display: block; }
    @font-face { font-family: "Source Han Sans SC"; src: url("assets/fonts/SourceHanSansSC-Bold.otf") format("opentype"); font-weight: 700; font-display: block; }
    @font-face { font-family: "Source Han Sans SC"; src: url("assets/fonts/SourceHanSansSC-Heavy.otf") format("opentype"); font-weight: 900; font-display: block; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { display: grid; place-items: center; overflow: hidden; background: #d9d9d6; font-family: "Inter Variable", "Source Han Sans SC", sans-serif; font-size-adjust: from-font; }
    @supports not (font-size-adjust: from-font) { body { font-size-adjust: .727; } }
    p, h1, h2, h3, figure { margin: 0; }
    .artboard { position: relative; flex: none; width: 1600px; height: 4000px; overflow: hidden; background: #eeeeec; color: #111110; }
    .header { position: absolute; top: 105px; left: 130px; right: 130px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 24px; }
    .iflink { width: 250px; height: 67px; object-fit: contain; }
    .divider { width: 2px; height: 49px; background: #a4a7ab; }
    .organizer-logo { width: 90px; height: 90px; object-fit: contain; }
    .organizer-label { color: #666662; font-size: 29px; }
    .organizer { font-size: 38px; font-weight: 700; }
    .header-note { font-size: 44px; font-weight: 750; }
    .series-head { position: absolute; top: 300px; left: 130px; right: 130px; }
    .learn-bar { display: flex; align-items: center; width: 100%; min-height: 350px; padding: 45px 60px; background: #ff4f0b; }
    .learn-bar img { width: 100%; height: 235px; object-fit: contain; }
    .workshop-bar { display: table; min-width: 1120px; padding: 18px 45px 35px; background: #111110; color: #fff; font-size: 238px; line-height: 1.12; font-weight: 900; letter-spacing: -8px; }
    .slogan { position: absolute; top: 1060px; left: 130px; font-size: 66px; line-height: 1.5; font-weight: 750; }
    .art { position: absolute; top: 1120px; right: 80px; width: 430px; height: 540px; }
    .art svg, .art img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .session { position: absolute; top: 1190px; left: 130px; width: 850px; }
    .session strong { display: block; color: #d74b18; font-size: 49px; line-height: 1.4; font-weight: 800; }
    .session p { margin-top: 22px; color: #555550; font-size: 38px; line-height: 1.55; }
    .schedule { position: absolute; top: 1430px; left: 130px; right: 130px; }
    .schedule > h2 { font-size: 80px; line-height: 1.4; font-weight: 800; }
    .schedule-note { margin-top: 14px; color: #555550; font-size: 42px; line-height: 1.6; }
    .schedule-list { margin-top: 70px; }
    .schedule-row { min-height: 285px; padding: 35px 0 42px; border-top: 2px solid #c3c5c9; }
    .schedule-row h3 { display: flex; align-items: baseline; gap: 30px; color: #d74b18; font-size: 63px; line-height: 1.5; font-weight: 800; }
    .schedule-row h3 span { min-width: 82px; font-family: "Inter Variable", sans-serif; font-size: 68px; }
    .schedule-row p { margin-top: 20px; color: #555550; font-size: 42px; line-height: 1.6; text-wrap: pretty; }
    .topics { position: absolute; top: 3090px; left: 130px; right: 130px; color: #555550; font-size: 35px; line-height: 1.6; text-align: center; }
    .footer { position: absolute; left: 0; right: 0; bottom: 0; height: 735px; background: #000; color: #f5f5f5; }
    .footer-brand { position: absolute; top: 123px; left: 92px; width: 436px; height: auto; }
    .footer-tagline { position: absolute; top: 285px; left: 96px; font-size: 37px; line-height: 1; font-weight: 700; white-space: nowrap; }
    .community-tag { position: absolute; left: 92px; bottom: 76px; font-size: 43px; line-height: 57px; font-weight: 700; white-space: nowrap; }
    .footer .qr-code { position: absolute; top: 112px; width: 196px; text-align: center; }
    .footer .qr-wechat { left: 1054px; }
    .footer .qr-xhs { left: 1324px; }
    .footer .qr-code img { display: block; width: 196px; height: 196px; object-fit: contain; }
    .footer figcaption { margin-top: 30px; font-size: 27px; line-height: 1; font-weight: 700; }
    @page { size: 800mm 2000mm; margin: 0; }
    @media print { body { display: block; background: none; } .artboard { transform: none !important; } }
  </style>
</head>
<body>
  <main class="artboard" data-width="1600" data-height="4000">
    <header class="header">
      <div class="brand">
        <img class="iflink" src="assets/logos/iflink-light-trimmed.svg" alt="IF.Link">{{ORGANIZER_BLOCK_HTML}}
      </div>
      <div class="header-note">第二课堂</div>
    </header>
    <div class="series-head">
      <div class="learn-bar"><img src="assets/logos/iflearn-light-trimmed.svg" alt="IF.Learn"></div>
      <h1 class="workshop-bar">Workshop</h1>
    </div>
    <p class="slogan">{{ROLLUP_SLOGAN}}</p>
    <div class="art">{{ILLUSTRATION_HTML}}</div>
    <section class="session"><strong>{{DATE}} · {{TIME}}</strong><p>{{LOCATION}}</p></section>
    <section class="schedule">
      <h2>课程安排</h2>
      <p class="schedule-note">{{INTRO}}</p>
      <div class="schedule-list">{{SCHEDULE_HTML}}</div>
    </section>
    <p class="topics">{{TOPICS}}<br>{{FEATURES}}</p>
    <footer class="footer">
      <img class="footer-brand" src="assets/logos/iflink-dark-trimmed.png" alt="IF.Link">
      <p class="footer-tagline">Link the IFs, connect the Dots.</p>
      <p class="community-tag">源自东南大学的<br>AI 创客与科技交流社区</p>
      <figure class="qr-code qr-wechat"><img src="assets/social/qr-wechat.png" alt="IF.Link 微信公众号二维码"><figcaption>微信公众号</figcaption></figure>
      <figure class="qr-code qr-xhs"><img src="assets/social/qr-xhs.png" alt="IF.Link 小红书二维码"><figcaption>小红书</figcaption></figure>
    </footer>
  </main>
  <script>
    const artboard = document.querySelector('.artboard');
    function fitArtboard() {
      const width = Number(artboard.dataset.width);
      const height = Number(artboard.dataset.height);
      const scale = Math.min(innerWidth / width, innerHeight / height);
      artboard.style.position = 'fixed';
      artboard.style.transformOrigin = 'top left';
      artboard.style.left = `${(innerWidth - width * scale) / 2}px`;
      artboard.style.top = `${(innerHeight - height * scale) / 2}px`;
      artboard.style.transform = `scale(${scale})`;
    }
    addEventListener('resize', fitArtboard);
    fitArtboard();
    window.posterReady = () => document.fonts.status === 'loaded' && Array.from(document.images).every(image => image.complete);
  </script>
</body>
</html>
